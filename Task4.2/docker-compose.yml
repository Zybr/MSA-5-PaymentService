name: msa5-payment

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    volumes:
      - elastic:/usr/share/elasticsearch/data
    networks:
      - camunda-platform

  zeebe:
    image: camunda/zeebe:${CAMUNDA_PLATFORM_VERSION}
    ports:
      - "26500:26500"
      - "9600:9600"
      - "8088:8080"
    environment:
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE=1
      - ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK=0.998
      - ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK=0.999
      - "JAVA_TOOL_OPTIONS=-Xms512m -Xmx512m"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9600' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - zeebe:/usr/local/zeebe/data
    networks:
      - camunda-platform
    depends_on:
      elasticsearch:
        condition: service_healthy

  operate:
    image: camunda/operate:${CAMUNDA_OPERATE_VERSION}
    ports:
      - "8081:8080"
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_OPERATE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_CSRFPREVENTIONENABLED=false
      - management.endpoints.web.exposure.include=health
      - management.endpoint.health.probes.enabled=true
    healthcheck:
      test: ["CMD-SHELL", "wget -O - -q 'http://localhost:8080/actuator/health/readiness'"]
      interval: 15s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks:
      - camunda-platform
    depends_on:
      zeebe:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  tasklist:
    image: camunda/tasklist:${CAMUNDA_TASKLIST_VERSION}
    ports:
      - "8082:8080"
    environment:
      - CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_TASKLIST_ZEEBE_RESTADDRESS=http://zeebe:8080
      - CAMUNDA_TASKLIST_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_ZEEBEELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_CSRFPREVENTIONENABLED=false
      - management.endpoints.web.exposure.include=health
      - management.endpoint.health.probes.enabled=true
    healthcheck:
      test: ["CMD-SHELL", "wget -O - -q 'http://localhost:8080/actuator/health/readiness'"]
      interval: 15s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks:
      - camunda-platform
    depends_on:
      zeebe:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  deploy-process:
    build:
      context: ./deploy-process
    volumes:
      - ./process.bpmn:/process.bpmn:ro
    depends_on:
      zeebe:
        condition: service_healthy
    networks:
      - camunda-platform
    command:
      - >
        echo 'Waiting for Zeebe...';
        until nc -z zeebe 26500; do sleep 2; done;
        echo 'Deploying payment-process...';
        zbctl deploy /process.bpmn --host zeebe --port 26500 --insecure;
        echo 'Process deployed.';

  payment-orchestrator:
    build:
      context: ./payment-orchestrator
    ports:
      - "8080:8080"
    environment:
      - ZEEBE_ADDRESS=zeebe:26500
      - HTTP_PORT=8080
    restart: unless-stopped
    networks:
      - camunda-platform
    depends_on:
      zeebe:
        condition: service_healthy
      deploy-process:
        condition: service_completed_successfully

volumes:
  zeebe:
  elastic:

networks:
  camunda-platform:
